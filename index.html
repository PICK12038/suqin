<body>

<div class="app" id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <a class="brand" href="#" id="brand" title="速勤 · 班级考勤工作台">
      <span class="brand-mark">速</span>
      <span class="brand-text">
        <b>速勤</b>
        <i>班级考勤工作台</i>
      </span>
    </a>

    <div class="search" id="search">
      <span class="search-ico" id="searchIco"></span>
      <input id="searchInput" type="search" placeholder="搜索学生 / 拼音首字母，如 王梓涵 或 wzh" autocomplete="off" spellcheck="false">
      <div class="search-results" id="searchResults" hidden></div>
    </div>

    <nav class="top-actions">
      <button class="btn btn-ghost" id="btnRoll" title="点名模式（Ctrl+Enter）">
        <span class="ico" data-ico="check"></span><span class="lbl">点名</span>
      </button>
      <button class="btn btn-ghost" id="btnStats" title="统计视图">
        <span class="ico" data-ico="chart"></span><span class="lbl">统计</span>
      </button>
      <button class="btn btn-ghost" id="btnExport" title="导出 / 备份">
        <span class="ico" data-ico="download"></span><span class="lbl">导出</span>
      </button>
      <button class="btn btn-primary" id="btnImport" title="导入名单或考勤">
        <span class="ico" data-ico="upload"></span><span class="lbl">导入</span>
      </button>
      <span class="top-sep"></span>
      <button class="btn btn-icon" id="btnTheme" title="切换深浅色">
        <span class="ico" data-ico="moon"></span>
      </button>
      <button class="btn btn-icon" id="btnSettings" title="设置">
        <span class="ico" data-ico="gear"></span>
      </button>
    </nav>
  </header>

  <div class="shell">

    <!-- 左栏：班级 / 小组 / 本周概览 -->
    <aside class="sidebar">
      <div class="side-block">
        <div class="side-head"><span>班级</span></div>
        <div class="side-list" id="classTabs"></div>
      </div>

      <div class="side-block">
        <div class="side-head"><span>小组</span></div>
        <div class="side-grid" id="groupTabs"></div>
      </div>

      <div class="side-block side-summary" id="sideSummary"></div>

      <div class="side-foot">
        <span class="save-state" id="saveState"><i></i>已保存</span>
      </div>
    </aside>

    <main class="main">

      <!-- 表格视图 -->
      <section class="view" id="viewGrid">
        <div class="toolbar">
          <div class="week-nav">
            <button class="btn btn-icon btn-sm" id="weekPrev" title="上一周（Alt+←）"><span class="ico" data-ico="left"></span></button>
            <button class="week-jump" id="weekJump" title="回到本周">
              <b id="weekLabel">第 1 周</b>
              <span id="weekRange">—</span>
            </button>
            <button class="btn btn-icon btn-sm" id="weekNext" title="下一周（Alt+→）"><span class="ico" data-ico="right"></span></button>
            <button class="btn btn-sm btn-soft" id="weekToday">本周</button>
          </div>

          <div class="toolbar-sep"></div>

          <div class="palette" id="palette">
            <span class="palette-lbl">标注</span>
            <div class="palette-items" id="paletteItems"></div>
          </div>

          <div class="toolbar-right">
            <button class="btn btn-sm btn-ghost" id="btnUndo" title="撤销（Ctrl+Z）"><span class="ico" data-ico="undo"></span>撤销</button>
            <button class="btn btn-sm btn-ghost" id="btnRedo" title="重做（Ctrl+Shift+Z）"><span class="ico" data-ico="redo"></span></button>
            <button class="btn btn-icon btn-ghost" id="btnHelp" title="快捷键与说明">?</button>
          </div>
        </div>

        <div class="demo-banner" id="demoBanner" hidden>
          <span>这是一份<b>示例数据</b>，随便点、随便改，熟悉后再清空建自己的班。</span>
          <button class="btn btn-xs btn-soft" id="btnClearDemo">清空示例，开始建班</button>
        </div>

        <div class="grid-shell">
          <div class="grid-wrap" id="gridWrap">
            <table class="grid" id="grid"></table>
          </div>
          <div class="grid-empty" id="gridEmpty" hidden></div>
        </div>

        <div class="hintbar" id="hintbar">
          <span><kbd>单击</kbd> 标记面板</span>
          <span><kbd>拖选</kbd> 批量标记</span>
          <span><kbd>1</kbd>–<kbd>6</kbd> 快捷键</span>
          <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销</span>
          <span class="hintbar-right" id="storageNote">数据保存在本机服务器</span>
        </div>
      </section>

      <!-- 统计视图 -->
      <section class="view view-stats" id="viewStats" hidden></section>

    </main>
  </div>
</div>

<!-- 浮层 -->
<div class="pop-layer" id="popLayer"></div>
<div class="modal-layer" id="modalLayer"></div>
<div class="toast-layer" id="toastLayer"></div>

function normalizeDB(db) {

if (!Array.isArray(g.students)) g.students = [];

if (!g.records || typeof g.records !== 'object') g.records = {};

function findClass(db, classId) {

/* ------------------------------------------------------------------ *
* 记录读写
* ------------------------------------------------------------------ */
function recKey(dateId, periodId) { return dateId + '|' + periodId; }
function getStatus(group, studentId, dateId, periodId) {
var m = group.records && group.records[studentId];
return (m && m[recKey(dateId, periodId)]) || '';
}
function setStatus(group, studentId, dateId, periodId, key) {
if (!group.records) group.records = {};
var m = group.records[studentId];
var k = recKey(dateId, periodId);
if (!key) {
if (m) { delete m[k]; if (!Object.keys(m).length) delete group.records[studentId]; }
return;
}
if (!m) m = group.records[studentId] = {};
m[k] = key;
}
function clearStudent(group, studentId) {
if (group.records) delete group.records[studentId];
}
function copyToPeriods(group, studentId, dateId, periodIds, key) {
periodIds.forEach(function (pid) { setStatus(group, studentId, dateId, pid, key); });
}
/* ------------------------------------------------------------------ *
* 汇总与统计
* ------------------------------------------------------------------ */
function emptyCounts() {
var c = {};
STATUSES.forEach(function (s) { c[s.key] = 0; });
return c;
}
/**
* 单个学生在给定日期/时段内的汇总
*/
function summarize(group, studentId, dateIds, periods) {
var counts = emptyCounts(), total = 0, abnormal = 0;
for (var i = 0; i < dateIds.length; i++) {
for (var j = 0; j < periods.length; j++) {
total++;
var st = getStatus(group, studentId, dateIds[i], periods[j].id);
if (st && counts.hasOwnProperty(st)) { counts[st]++; abnormal++; }
}
}

total: total,
abnormal: abnormal,
counts: counts,
rate: total ? (total - abnormal) / total : 1,
worst: worstStatus(counts),

}
function worstStatus(counts) {

}
function summaryText(counts) {

/**

function computeStats(group, dateIds, periods) {

dateIds.forEach(function (d, i) { dateSet[d] = i; dIdx[d] = 0; });
dateIds.forEach(function (d) {
perDate.push({ id: d, label: fmtLabel(d), total: 0, abnormal: 0, filled: 0 });

group.students.forEach(function (st, si) {

for (var i = 0; i < dateIds.length; i++) {
var d = dateIds[i];

for (var j = 0; j < periods.length; j++) {
slots++; t++;
perDate[i].total++;
var s = getStatus(group, st.id, d, periods[j].id);
if (s && counts.hasOwnProperty(s)) {
counts[s]++; byStatus[s]++;
ab++; abnormal++; filled++;
perDate[i].abnormal++; perDate[i].filled++;
dayAb++;
}
}
if (dayAb) dIdx[d] += dayAb;
}
perStudent.push({
id: st.id, name: st.name, index: si, total: t, abnormal: ab,
counts: counts, rate: t ? (t - ab) / t : 1, worst: worstStatus(counts)
});
});
var ranking = perStudent.slice().sort(function (a, b) {
return b.abnormal - a.abnormal || a.name.localeCompare(b.name, 'zh');
});

students: group.students.length,
dates: dateIds.length,
periods: periods.length,
slots: slots,
filled: filled,
abnormal: abnormal,
rate: slots ? (slots - abnormal) / slots : 1,
byStatus: byStatus,
perStudent: perStudent,
perDate: perDate,

}
function dayStats(group, dateId, periods) {
var out = { filled: 0, total: group.students.length * periods.length, byStatus: emptyCounts(), students: {} };
group.students.forEach(function (st) {
var c = emptyCounts(), n = 0;

/* ------------------------------------------------------------------ *
* 搜索（姓名 + 拼音首字母）
* ------------------------------------------------------------------ */
function initialsOf(name) {

}
function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ''); }
function matchScore(query, name) {
var q = norm(query);

if (n === q) return 100;
if (n.indexOf(q) === 0) return 90;
if (n.indexOf(q) > 0) return 70;
var ini = initialsOf(name);
if (ini === q) return 85;
if (ini.indexOf(q) === 0) return 75;
if (ini.indexOf(q) > 0) return 50;
var k = 0;
for (var i = 0; i < ini.length && k < q.length; i++) if (ini[i] === q[k]) k++;

var sc = matchScore(query, s.name);
if (sc > 0) out.push({
classId: c.id, groupId: g.id, studentId: s.id, name: s.name,
groupName: g.name, className: c.name, score: sc

}

function parseRosterBlocks(text) {
var lines = String(text || '').split(/\r?\n/);
var blocks = [], cur = { name: '', names: [] };
lines.forEach(function (line) {
var s = line.trim();
if (!s) return;
var m = s.match(/^第?\s*([0-9一二三四五六七八九十]+)\s*组\s*[:：]?$/);
if (m) {
if (cur.names.length) blocks.push(cur);
cur = { name: '第' + m[1] + '组', names: [] };
return;
}
cur.names = cur.names.concat(C.parseNames(s));
});
if (cur.names.length) blocks.push(cur);
return blocks;
}

var a = document.createElement('a');

/* ------------------------------------------------------------------ *
* 快捷键
* ------------------------------------------------------------------ */
function bindKeys() {
document.addEventListener('keydown', function (e) {
if (state.modal && state.roll) {
var tag = (e.target.tagName || '').toUpperCase();
if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
var rows = rollStudents();
if (e.key === 'Escape') { state.roll = null; closeModal(); return; }
if (e.key === 'ArrowDown') { e.preventDefault(); state.roll.cur = Math.min(rows.length - 1, state.roll.cur + 1); fillRoll(); scrollRollCur(); return; }
if (e.key === 'ArrowUp') { e.preventDefault(); state.roll.cur = Math.max(0, state.roll.cur - 1); fillRoll(); scrollRollCur(); return; }
if (e.key === 'Enter') { e.preventDefault(); state.roll.cur = Math.min(rows.length - 1, state.roll.cur + 1); fillRoll(); scrollRollCur(); return; }
if (/^[0-6]$/.test(e.key)) {
e.preventDefault();
var st = rows[state.roll.cur];
if (!st) return;
var key = e.key === '0' ? '' : STATUSES[+e.key - 1].key;
rollMark(st.id, key);
state.roll.cur = Math.min(rows.length - 1, state.roll.cur + 1);
fillRoll(); scrollRollCur();
return;
}
return;
}
if (state.modal) {
if (e.key === 'Escape') return closeModal();
return;
}
var t = e.target;
var tagName = (t && t.tagName || '').toUpperCase();
if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT' || (t && t.isContentEditable)) return;
var mod = e.ctrlKey || e.metaKey;
if (mod && e.key.toLowerCase() === 'z') {
e.preventDefault();
if (e.shiftKey) redo(); else undo();
return;
}
if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
if (mod && e.key === 'Enter') { e.preventDefault(); openRoll(); return; }
if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#searchInput').focus(); return; }
if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); toast('已保存', 'ok', 1000); return; }
if (e.key === 'Escape') { closePop(); clearSelection(); return; }
if (state.view !== 'grid') return;
if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goWeek(state.week - 1); return; }
if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goWeek(state.week + 1); return; }
var g = curGroup();
if (!g || !g.students.length) return;
var rows = g.students.length, cols = weekDates().length * periods().length;
if (!state.active) {
if (/^[1-6]$/.test(e.key) || e.key === '0') { selectCell(0, 0, false); applyStatus(e.key === '0' ? '' : STATUSES[+e.key - 1].key); return; }
if (e.key.indexOf('Arrow') === 0) { e.preventDefault(); selectCell(0, 0, false); return; }
return;
}
if (/^[1-6]$/.test(e.key)) { e.preventDefault(); applyStatus(STATUSES[+e.key - 1].key); return; }
if (e.key === '0' || e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); applyStatus(''); return; }
if (e.key === 'Enter') {
e.preventDefault();
var td = $('#grid td.cell[data-r="' + state.active.r + '"][data-c="' + state.active.c + '"]');
if (td) openCellPop(td);
return;
}
var dr = 0, dc = 0;
if (e.key === 'ArrowUp') dr = -1;
else if (e.key === 'ArrowDown') dr = 1;
else if (e.key === 'ArrowLeft') dc = -1;
else if (e.key === 'ArrowRight') dc = 1;
else return;
e.preventDefault();
var nr = state.active.r + dr, nc = state.active.c + dc;
if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return;
selectCell(nr, nc, e.shiftKey);
});
}

cloudFetch('GET').then(function (res) {
cloudPulling = false;
if (!res.ok || !res.db) return;
var remoteAt = res.db.meta && res.db.meta.updatedAt;
var localAt = state.db.meta && state.db.meta.updatedAt;
if (remoteAt && localAt && remoteAt > localAt + 500) {
state.db = res.db;
ensureSelectionValid();
renderAll();
toast('已同步其他设备的更新', 'ok', 1800);
}
}).catch(function () { cloudPulling = false; });
}
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
